# Plantilla de la configuración de cada equipo.
# Cópiala como config.local.yml (no se sube a GitHub) y rellénala.
# Los valores de cada bloque sustituyen a los params de la cabecera del Rmd.
# La clave es el nombre del equipo, que en R se ve con Sys.info()[["nodename"]]

equipos:
  MI_PORTATIL:
    python_mode: "python"
    python_path: "C:/ruta/a/python.exe"
  MI_SOBREMESA:
    python_mode: "conda"
    conda_env: "reticulate"
